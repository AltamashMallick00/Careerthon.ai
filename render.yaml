services:
  - type: web
    name: careerthon-ai
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: RENDER_EXTERNAL_URL
        value: https://carrerthon.in
      - key: DATABASE_URL
        fromDatabase:
          name: careerthon-db
          property: connectionString

databases:
  - name: careerthon-db
    plan: free
    databaseName: careerthon
    user: careerthon_user
