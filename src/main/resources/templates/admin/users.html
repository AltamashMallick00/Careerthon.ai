<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Users - Careerthon.AI')}"></head>
<body class="bg-slate-50 min-h-screen pt-24 pb-12">
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-10 flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-200 pb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Manage Users</h1>
                <p class="mt-2 text-lg text-slate-600">View, block, or delete user accounts.</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-4">
                <a href="/admin/dashboard" class="inline-flex items-center px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 shadow-sm">
                    Back to Admin Dashboard
                </a>
            </div>
        </div>

        <div th:if="${message}" class="mb-8 bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center text-emerald-700">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span th:text="${message}"></span>
        </div>

        <div th:if="${error}" class="mb-8 bg-rose-50 border border-rose-200 rounded-xl p-4 flex items-center text-rose-700">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            <span th:text="${error}"></span>
        </div>

        <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-sm font-bold text-slate-600 uppercase tracking-wider">
                            <th class="p-4 pl-6">ID</th>
                            <th class="p-4">Full Name</th>
                            <th class="p-4">Username</th>
                            <th class="p-4">Roles</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 pr-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm">
                        <tr th:each="user : ${users}" class="hover:bg-slate-50 transition-colors">
                            <td class="p-4 pl-6 font-medium text-slate-900" th:text="${user.id}">1</td>
                            <td class="p-4 text-slate-700 font-medium" th:text="${user.fullName}">Name</td>
                            <td class="p-4 text-slate-600" th:text="${user.username}">Username</td>
                            <td class="p-4 text-slate-600">
                                <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700" th:text="${user.roles}">ROLE_USER</span>
                            </td>
                            <td class="p-4">
                                <span th:if="${user.enabled}" class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700">Active</span>
                                <span th:unless="${user.enabled}" class="px-2.5 py-1 rounded-full text-xs font-bold bg-rose-50 text-rose-700">Blocked</span>
                            </td>
                            <td class="p-4 pr-6 text-right flex items-center justify-end gap-3">
                                <form th:if="${!#strings.contains(user.roles, 'ROLE_ADMIN')}" th:action="@{/admin/users/{id}/toggle-block(id=${user.id})}" method="post" class="inline">
                                    <button type="submit" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors"
                                            th:classappend="${user.enabled} ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200'"
                                            th:text="${user.enabled ? 'Block' : 'Unblock'}">
                                    </button>
                                </form>
                                <form th:if="${!#strings.contains(user.roles, 'ROLE_ADMIN')}" th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" class="inline" onsubmit="return confirm('Are you sure you want to delete this user? This cannot be undone.');">
                                    <button type="submit" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-100 text-rose-700 hover:bg-rose-200 transition-colors">
                                        Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="p-8 text-center text-slate-500">No users found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
