<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Create Your Account - Careerthon.AI')}"></head>
<body class="bg-themed-pure min-h-screen flex flex-col relative overflow-x-hidden">
    <!-- Background Effects -->
    <div class="absolute inset-0 bg-grid opacity-[0.03]"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full max-w-4xl max-h-4xl bg-[radial-gradient(circle_at_50%_50%,rgba(16,185,129,0.1),transparent_60%)] animate-pulse-soft"></div>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10 pt-32">
        <div class="max-w-md w-full active" data-reveal>
            
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-emerald-600 rounded-2xl flex items-center justify-center text-white font-black text-3xl shadow-glow-emerald mx-auto mb-6 transform hover:-rotate-12 transition-transform">🚀</div>
                <h2 class="text-4xl font-black text-themed-main mb-2">Create Account</h2>
                <p class="text-themed-body font-medium">Join Careerthon.AI intelligence platform.</p>
            </div>

            <div class="premium-card !p-8 glass border-white/20 shadow-[0_40px_100px_-20px_rgba(15,23,42,0.3)]">
                
                <div th:if="${error}" class="bg-rose-500/10 border border-rose-500/50 p-4 rounded-xl mb-6 flex items-center gap-3">
                    <div class="text-rose-500 font-bold">⚠</div>
                    <p class="text-xs font-bold text-rose-600 dark:text-rose-400" th:text="${error}">Error message</p>
                </div>

                <form th:action="@{/signup}" method="POST" class="space-y-5">
                    
                    <div>
                        <label class="block text-[10px] font-black text-emerald-500 dark:text-emerald-400 uppercase tracking-[0.2em] mb-2">Full Name</label>
                        <div class="relative group">
                            <div class="absolute -inset-1 bg-emerald-500/10 rounded-xl blur-md group-focus-within:bg-emerald-500/20 transition-all"></div>
                            <input type="text" name="fullName" required 
                                   class="relative w-full py-3.5 px-4 bg-themed-pure rounded-xl border-2 border-themed-soft focus:border-emerald-500 outline-none transition-all text-sm font-bold text-themed-main placeholder:text-slate-400" 
                                   placeholder="Priyanshu Shekhar">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-emerald-500 dark:text-emerald-400 uppercase tracking-[0.2em] mb-2">Username</label>
                        <div class="relative group">
                            <div class="absolute -inset-1 bg-emerald-500/10 rounded-xl blur-md group-focus-within:bg-emerald-500/20 transition-all"></div>
                            <input type="text" name="username" required 
                                   class="relative w-full py-3.5 px-4 bg-themed-pure rounded-xl border-2 border-themed-soft focus:border-emerald-500 outline-none transition-all text-sm font-bold text-themed-main placeholder:text-slate-400" 
                                   placeholder="priyanshu_s">
                        </div>
                        <p class="mt-1 text-[10px] text-slate-400 font-medium">Used to sign in to your dashboard.</p>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-emerald-500 dark:text-emerald-400 uppercase tracking-[0.2em] mb-2">Password</label>
                        <div class="relative group">
                            <div class="absolute -inset-1 bg-emerald-500/10 rounded-xl blur-md group-focus-within:bg-emerald-500/20 transition-all"></div>
                            <input type="password" name="password" required 
                                   class="relative w-full py-3.5 px-4 bg-themed-pure rounded-xl border-2 border-themed-soft focus:border-emerald-500 outline-none transition-all text-sm font-bold text-themed-main placeholder:text-slate-400" 
                                   placeholder="••••••••">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-emerald-500 dark:text-emerald-400 uppercase tracking-[0.2em] mb-2">Mobile Number (For Offer Letters & Records)</label>
                        <div class="relative group">
                            <div class="absolute -inset-1 bg-emerald-500/10 rounded-xl blur-md group-focus-within:bg-emerald-500/20 transition-all"></div>
                            <div class="flex">
                                <span class="inline-flex items-center px-3 rounded-l-xl border-2 border-r-0 border-themed-soft bg-themed-soft text-xs font-bold text-themed-main">
                                    +91
                                </span>
                                <input type="tel" name="phoneNumber" required pattern="[0-9]{10}"
                                       class="relative w-full py-3.5 px-4 bg-themed-pure rounded-r-xl border-2 border-themed-soft focus:border-emerald-500 outline-none transition-all text-sm font-bold text-themed-main placeholder:text-slate-400" 
                                       placeholder="9876543210">
                            </div>
                        </div>
                        <p class="mt-1 text-[10px] text-slate-400 font-medium">Stored on profile for offer letter generation.</p>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-emerald-500 dark:text-emerald-400 uppercase tracking-[0.2em] mb-2">Human Verification</label>
                        <div class="relative group">
                            <div class="absolute -inset-1 bg-emerald-500/10 rounded-xl blur-md group-focus-within:bg-emerald-500/20 transition-all"></div>
                            <div class="flex items-center gap-3 relative">
                                <div class="bg-themed-soft px-4 py-3.5 rounded-xl border-2 border-themed-soft text-sm font-black text-themed-main flex-shrink-0" th:text="${captchaQuestion}">5 + 3 = ?</div>
                                <input type="text" name="captcha" required 
                                       class="w-full py-3.5 px-4 bg-themed-pure rounded-xl border-2 border-themed-soft focus:border-emerald-500 outline-none transition-all text-sm font-bold text-themed-main placeholder:text-slate-400" 
                                       placeholder="Answer">
                            </div>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full btn-premium py-4 rounded-xl text-base flex justify-center items-center group shadow-glow-emerald">
                            Create Account
                            <svg class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                        </button>
                    </div>
                </form>
                
                <div class="mt-6 pt-6 border-t border-themed-soft text-center">
                    <p class="text-sm font-medium text-themed-body">
                        Already have an account? 
                        <a th:href="@{/login}" class="font-bold text-emerald-600 hover:text-emerald-500 transition-colors">Sign in here</a>
                    </p>
                </div>
            </div>
            
            <div class="mt-6 text-center text-xs font-medium text-themed-body opacity-60">
                🔒 Protected by Careerthon.AI Security Protocols
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
